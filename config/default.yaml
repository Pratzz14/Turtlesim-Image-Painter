painter:
  ros__parameters:
    image_path: ''
    plan_output: ''
    preview_output: ''
    max_width: 80
    max_height: 80
    palette_size: 4
    transparency_color: [255, 255, 255]
    background_threshold: 0.5
    background_tolerance: 24
    allow_upscale: false
    exclude_background: true
    color_order: largest_first
    path_order: raster
    stroke_orientation: auto
    pen_width: 6
    auto_pen_width: true
    background_r: 255
    background_g: 255
    background_b: 255
    canvas_min_x: 1.0
    canvas_max_x: 10.0
    canvas_min_y: 1.0
    canvas_max_y: 10.0
    parking_x: 0.5
    parking_y: 0.5
    control_rate_hz: 20.0
    linear_gain: 3.0
    angular_gain: 12.0
    max_linear_speed: 4.0
    max_angular_speed: 8.0
    position_tolerance: 0.05
    angle_tolerance: 0.02
    service_timeout_sec: 5.0
    pose_timeout_sec: 2.0
    movement_timeout_sec: 30.0
    color_change_pause_sec: 1.0
    dry_run: false
